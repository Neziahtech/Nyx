name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        # Advisory only: remaining high/critical advisories can't be patched
        # within the approved majors (see docs/security.md "Reviewed
        # advisories"). Dependabot opens the upgrade PRs; flip this back to a
        # blocking gate once they're merged.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
